name: Build VERSIA Gmail APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test OTP extraction
        run: |
          mkdir -p build/otp-tests
          javac -encoding UTF-8 -d build/otp-tests app/src/main/java/com/owlmail/overlay/gmail/OtpExtractor.java tests/OtpExtractorTest.java
          java -cp build/otp-tests com.owlmail.overlay.gmail.OtpExtractorTest
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VERSIA-GMAIL-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
